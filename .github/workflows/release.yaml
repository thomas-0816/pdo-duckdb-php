name: Release

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  linux_macos:
    name: Linux, MacOS
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # publish release
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - macos-15
        php-version:
          - 8.2
          - 8.3
          - 8.4
          - 8.5
          - 8.6
        thread-safety:
          - zts
          - nts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
        env:
          phpts: ${{ matrix.thread-safety }}
      - name: Download DuckDB static libs for this os/arch
        shell: bash
        env:
          os: ${{ matrix.os }}
        run: |
          uname -a
          php -v
          apt-get update && apt-get install -y --no-install-recommends libgcc-13-dev
          case "$os" in
            ubuntu-22.04)     libduckdb=duckdb-static-libs-linux-amd64.tar.gz ;;
            ubuntu-22.04-arm) libduckdb=duckdb-static-libs-linux-arm64.tar.gz ;;
            macos-15)         libduckdb=duckdb-static-libs-osx-arm64.tar.gz ;;
            *) echo "unmapped runner os"; exit 1 ;;
          esac
          curl -fsSL "https://github.com/duckdb/duckdb/releases/download/v2.0.0/${libduckdb}" -o ${libduckdb}
          tar xvzf ${libduckdb}
          tar xvzf libduckdb-src.tar.gz
      - name: Build and upload prebuilt binary
        uses: php/pie-ext-binary-builder@cbe134360897f23793f23c2edc7602261d205a25 # 0.0.4
        with:
          release-tag: ${{ github.event.release.tag_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          configure-flags: '--with-pdo-duckdb'

  linux_alpine:
    name: "Linux Alpine"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # publish release
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the extension and upload zip archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.release.tag_name }}
        run: |
          docker build --build-arg tag=${tag} -f Dockerfile.alpine_build -t pdo-duckdb-alpine-build .
          docker run --rm -w /pdo-duckdb-php/ pdo-duckdb-alpine-build /bin/sh -c 'tar -cf - *.zip' | tar -xvf -
          ls -l *.zip
          gh release upload "$tag" *.zip --clobber

  windows_84_85_86:
    name: Windows PHP 8.4-8.6
    runs-on: ${{ (matrix.php-version == '8.6' && 'windows-2025-vs2026') || 'windows-2022' }}
    permissions:
      contents: write # publish release
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - 8.4
          - 8.5
          - 8.6
        ts:
          - nts
          - ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download libduckdb
        shell: bash
        run: |
          curl -fsSL "https://github.com/duckdb/duckdb/releases/download/v2.0.0/duckdb-static-libs-windows-amd64.tar.gz" -o duckdb-static-libs-windows-amd64.tar.gz
          tar xvzf duckdb-static-libs-windows-amd64.tar.gz
          tar xvzf libduckdb-src.tar.gz
          ls -lisa
          MSYS_NO_PATHCONV=1 tzutil /s "W. Europe Standard Time"
      - name: Build extension
        uses: php/php-windows-builder/extension@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          php-version: ${{ matrix.php-version }}
          ts: ${{ matrix.ts }}
          arch: x64
          args: --with-pdo-duckdb
          test-workers: 1
      - name: Upload as a release asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$tag" artifacts/*.zip --clobber

  windows_82_83:
    name: Windows PHP 8.2-8.3
    runs-on: windows-2022
    permissions:
      contents: write # publish release
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - 8.2
          - 8.3
        ts:
          - nts
          - ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download libduckdb dll
        shell: bash
        run: |
          curl -fsSL "https://github.com/duckdb/duckdb/releases/download/v2.0.0/duckdb-shared-libs-windows-amd64.tar.gz" -o duckdb-shared-libs-windows-amd64.tar.gz
          tar xvzf duckdb-shared-libs-windows-amd64.tar.gz
          tar xvzf libduckdb-src.tar.gz
          ls -lisa
          MSYS_NO_PATHCONV=1 tzutil /s "W. Europe Standard Time"
          mv config.w32_dynamic config.w32
      - name: Build extension
        uses: php/php-windows-builder/extension@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          php-version: ${{ matrix.php-version }}
          ts: ${{ matrix.ts }}
          arch: x64
          args: --with-pdo-duckdb
          test-workers: 1
      - name: Bundle duckdb.dll, upload as a release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem artifacts -Filter "php_pdo_duckdb-*.zip" |
                 Where-Object { $_.Name -notlike '*-logs*' } | Select-Object -First 1
          if (-not $zip) { throw "no extension artifact zip produced" }
          Expand-Archive $zip.FullName -DestinationPath stage -Force
          Copy-Item duckdb.dll -Destination stage\ -Force
          $out = $zip.Name
          if (Test-Path $out) { Remove-Item $out -Force }
          Compress-Archive -Path stage\* -DestinationPath $out
          gh release upload "$Env:tag" "$out" --clobber

  clamav:
    name: "Docker: clamAV"
    runs-on: ubuntu-24.04
    needs: [linux_macos, windows_84_85_86, windows_82_83, linux_alpine]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build container and run clamAV
        run: |
          gh release download -p "*" -D . -R thomas-0816/pdo-duckdb-php
          ls -lisah
          docker run --rm --entrypoint sh -v $(pwd):/app clamav/clamav:latest /app/clamdscan.sh

  publish:
    name: "Publish: packagist"
    runs-on: ubuntu-24.04
    needs: [clamav]
    steps:
      - name: Publish release on Packagist
        env:
          TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          curl -fsSL -X POST -H 'content-type:application/json' -H "Authorization: Bearer thomas-0816:${TOKEN}" \
            "https://packagist.org/api/update-package" -d'{"repository":{"url":"https://packagist.org/packages/thomas-0816/pdo-duckdb-php"}}'
